name: matricconnect
description: "MatricConnect - peer-to-peer study hub for matric students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing - bottom tabs that survive navigation + deep links
  go_router: ^14.2.7

  # State management - reactive dependency graph
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.6.0

  # Data models - copyWith, equality, JSON out of the box
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Lightweight local cache for "show something even when offline" screens
  shared_preferences: ^2.3.2

  # Date formatting for "uploaded 2 days ago" style text
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
